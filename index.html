<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Weekend Hangout</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* ===== TOKENS & BASE ===== */
*{box-sizing:border-box;margin:0}
:root{--ink:#2b2d42;--mint:#7fd8be;--lav:#b8a9ff;--peach:#ffc8a2;--sky:#a5d8ff;--sun:#ffe29a;--red:#ff7b7b;--grn:#4cc38a}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:linear-gradient(160deg,#e3f4ff,#f1e9ff 50%,#fff0e3);min-height:100dvh;display:flex;justify-content:center;overflow-x:hidden;line-height:1.45}
.blob{position:fixed;border-radius:50%;filter:blur(45px);opacity:.55;z-index:0;animation:fl 14s ease-in-out infinite alternate}
.app{position:relative;z-index:1;width:100%;max-width:480px;min-height:100dvh;display:flex;flex-direction:column;background:rgba(255,255,255,.6);box-shadow:0 0 40px rgba(120,100,200,.18)}
header{position:sticky;top:0;z-index:20;background:#fff;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));border-bottom:2px solid #eee8ff;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.logo{flex:1;min-width:0;font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:2px solid #eee8ff;background:#fff;border-radius:12px;width:40px;height:36px;font-size:18px;cursor:pointer;flex:none}
.hud{display:none;width:100%;align-items:center;gap:8px}.ig .hud{display:flex}
.chip2{background:#fff6d6;border-radius:10px;padding:2px 9px;font-weight:900;font-size:13px;white-space:nowrap}
.pgw{flex:1;min-width:60px;height:12px;background:#ece8fa;border-radius:8px;overflow:hidden}
.pgw i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--lav));transition:width .6s}
#view{flex:1;padding:14px 14px 20px}
#view.in{animation:in .45s cubic-bezier(.2,.8,.2,1)}#view.out{opacity:0;transform:translateY(-10px);transition:.2s}
footer{text-align:center;font-size:12px;opacity:.75;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
h1{font-size:26px;line-height:1.15}h2{font-size:21px;margin:6px 0}h3{font-size:16px;margin-bottom:4px}
.sub{opacity:.75;font-size:14px}.story{margin:4px 0 10px;font-size:14.5px}
.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 4px 0 #e6e0fa,0 8px 20px rgba(120,100,200,.12);margin-bottom:14px}
.hero{text-align:center}.hero .stage{margin:10px 0 0}
.tag{display:inline-block;background:var(--lav);color:#fff;font-weight:900;font-size:12px;border-radius:10px;padding:2px 10px;margin-right:6px}.t2{background:var(--mint)}
.mh{display:flex;flex-wrap:wrap;gap:4px}
input{width:100%;font:inherit;font-weight:800;padding:12px;border-radius:14px;border:2px solid #e2dcf7;outline:none;margin-top:6px}input:focus{border-color:var(--lav)}
.ul{padding-left:18px;font-size:14px}.ul li{margin:3px 0}
/* ===== BUTTONS ===== */
.btn{display:block;width:100%;font:inherit;font-weight:900;font-size:16px;border:0;border-radius:16px;padding:13px 18px;background:var(--grn);color:#fff;box-shadow:0 4px 0 #2f9a68;cursor:pointer;transition:.15s;margin-bottom:12px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2f9a68}.btn:disabled{opacity:.45;pointer-events:none}
.btn.alt{background:var(--lav);box-shadow:0 4px 0 #8b79e0}.btn.red{background:var(--red);box-shadow:0 4px 0 #d95555}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #ddd;border:2px solid #eee}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1 1 130px}
:focus-visible{outline:3px solid #7a5cff;outline-offset:2px}
/* ===== STAGE & CHARACTERS ===== */
.stage{position:relative;overflow:hidden;border-radius:20px;padding:8px 2px 8px;margin-bottom:12px;background:linear-gradient(#cfeaff,#eef9ff 62%,#bfe9a8 62%)}
.stage::before{content:'';position:absolute;left:0;right:0;bottom:0;height:48px;z-index:0;background:repeating-linear-gradient(90deg,#a8dd8c 0 24px,#9bd17f 24px 48px)}
.stage.go::before{animation:gr .6s linear infinite}
.crew{position:relative;z-index:1;display:flex;justify-content:space-between;gap:2px;transition:.4s}.crew.close{gap:0;padding:0 8px}
.char{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;border-radius:14px;cursor:pointer;transition:.2s}
.char.hot{background:rgba(255,255,255,.55);transform:scale(1.04)}
.bub{height:34px;display:flex;align-items:center}.bub span{background:#fff;border-radius:14px;padding:1px 7px;font-size:20px;box-shadow:0 2px 6px rgba(0,0,0,.18);animation:pop .3s}
.sv{width:100%;max-width:72px;height:auto;display:block;overflow:visible}
.nm{font-weight:900;font-size:11px;background:#fff;border-radius:10px;padding:1px 7px;margin-top:2px;white-space:nowrap}
.bar{width:88%;height:8px;background:#fff;border-radius:6px;overflow:hidden;margin-top:4px;border:1px solid #ddd}.bar i{display:block;height:100%;width:0;transition:.3s}
.tags{min-height:32px;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:3px}
.chip{background:#fff;border-radius:8px;padding:0 3px;font-size:16px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25)}.chip.dim{opacity:.7;cursor:default}
.char .leg,.char .arm{transform-box:fill-box;transform-origin:50% 4%}
.char .body,.char .head{transform-box:fill-box;transform-origin:50% 100%}
.char .body{animation:br 2.6s ease-in-out infinite}
.char .eye{transform-box:fill-box;transform-origin:center;animation:bl 4s infinite}
.walk .leg.l,.walk .arm.r{animation:sw .5s ease-in-out infinite alternate}
.walk .leg.r,.walk .arm.l{animation:sw .5s ease-in-out infinite alternate-reverse}
.walk .body{animation:bob .25s ease-in-out infinite alternate}
.slow .leg,.slow .arm{animation-duration:1.4s!important}
.slow .body{animation:stag 1.4s ease-in-out infinite}
.jump .sv{animation:jmp .55s ease-out 3}
.shiver .sv{animation:shv .1s linear infinite alternate}
.wave .arm.r{animation:wv .45s ease-in-out infinite alternate;transform:rotate(-150deg)}
.tired .head{transform:translateY(3px) rotate(7deg)}
.sit .leg.l{transform:rotate(-82deg)}.sit .leg.r{transform:rotate(-72deg)}.sit .arm{transform:rotate(8deg)}
/* ===== INTERACTION UI ===== */
.deck{position:relative;height:250px;margin-bottom:12px}
.sc{position:absolute;inset:0;background:#fff;border-radius:22px;box-shadow:0 4px 0 #e6e0fa,0 10px 24px rgba(120,100,200,.2);padding:12px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;touch-action:pan-y;user-select:none;cursor:grab;transition:transform .3s,opacity .3s}
.stamp{width:100%;display:flex;justify-content:space-between;font-size:13px;min-height:22px}.stamp b{opacity:0;border:2px solid;border-radius:8px;padding:0 6px}.stamp .sl{color:var(--red)}.stamp .sr{color:var(--grn)}
.big{font-size:56px;line-height:1.1}.price{font-weight:900;color:#6a55d9}
.chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}.chips span{background:#f3f0ff;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:800}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:50px;margin-bottom:10px;align-items:center}
.it{background:#fff;border:2px solid #e6e0fa;border-radius:14px;padding:6px 10px;font-weight:800;font-size:13px;cursor:grab;user-select:none}.it.sel{border-color:var(--lav);background:#f3f0ff;transform:scale(1.06)}
.dg{position:fixed;pointer-events:none;z-index:99;transform:translate(-50%,-50%) scale(1.1);opacity:.92;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:#fff;border:2px solid #e6e0fa;border-radius:16px;padding:12px;margin-bottom:8px;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--lav)}.opt b{display:block}.opt span{font-size:13.5px}.opt.x{opacity:.55;border-color:var(--red);pointer-events:none}.opt.v{border-color:var(--grn);background:#eafff4;pointer-events:none}
.bill{background:#fff9e3;border-radius:14px;padding:10px 12px;font-size:13.5px;margin-bottom:10px}
.fb{border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px;margin:8px 0;animation:pop .3s}
.fb.ok{background:#e1fbee;color:#17724a}.fb.no{background:#fff0f0;color:#a33}.fb.inf{background:#f3f0ff}
.hint{background:var(--sun);border-radius:14px;padding:10px 12px;font-size:14px;margin:0 0 12px;animation:pop .3s}
.bg{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px}
.bd{text-align:center;padding:8px 4px;border-radius:14px;background:#f6f3ff;font-size:11px;font-weight:800}.bd.lock{filter:grayscale(1);opacity:.4}.bd span{font-size:28px;display:block}
.score{font-size:46px;font-weight:900;text-align:center;line-height:1.1}.rank{text-align:center;font-weight:900;font-size:18px;color:#6a55d9}
.rv{padding:8px 0;border-bottom:1px dashed #e4def7;font-size:14px}.rv:last-child{border:0}
#toasts{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:6px;z-index:60;pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:16px;padding:8px 14px;font-weight:800;font-size:14px;animation:pop .35s,in .3s reverse 2.4s forwards}
.sunset{border-radius:22px;overflow:hidden;background:linear-gradient(#3b2f6b,#c76b98 45%,#ffb36b 75%,#ffd9a0);padding-bottom:12px;margin-bottom:14px}
.sky{height:110px;position:relative}.sun{position:absolute;left:50%;bottom:-30px;width:90px;height:90px;margin-left:-45px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 50px #ffd27a}
.star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;animation:tw 2s infinite alternate}.cloud{position:absolute;font-size:30px;opacity:.85;animation:dr 18s ease-in-out infinite alternate}
.blanket{height:14px;margin:0 6%;border-radius:8px;background:repeating-linear-gradient(90deg,#ff8b8b 0 14px,#fff 14px 28px)}
.quote{font-size:16px;font-weight:800;text-align:center;font-style:italic}
canvas#rain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.shake{animation:shk .4s}
/* ===== KEYFRAMES ===== */
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.98)}}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
@keyframes fl{to{transform:translate(30px,-40px)}}
@keyframes br{50%{transform:scaleY(1.025)}}
@keyframes sw{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
@keyframes bob{to{transform:translateY(-3px)}}
@keyframes stag{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(2px)}}
@keyframes jmp{50%{transform:translateY(-22px)}}
@keyframes shv{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
@keyframes wv{from{transform:rotate(-135deg)}to{transform:rotate(-175deg)}}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes tw{to{opacity:.2}}@keyframes dr{to{transform:translateX(40px)}}
@keyframes gr{to{background-position:-48px 0}}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="blob" style="width:260px;height:260px;background:#b8e8ff;left:-60px;top:10%"></div>
<div class="blob" style="width:240px;height:240px;background:#ffd1e3;right:-60px;bottom:10%;animation-delay:-5s"></div>
<div class="app">
  <header>
    <div class="logo">🛋️ The Weekend Hangout <span id="hn" style="opacity:.6;font-weight:700"></span></div>
    <button class="ib" id="mute" aria-label="Mute / unmute musik">🔊</button>
    <div class="hud"><span class="chip2">⭐ <b id="sc">0</b></span><div class="pgw"><i id="pgb"></i></div><span class="chip2" id="pgv">0%</span></div>
  </header>
  <main id="view"></main>
  <footer>Education &amp; Training Dept. © 2026</footer>
</div>
<div id="toasts"></div>

<script>
(()=>{'use strict';
/* ===== HELPERS & LMS STATE ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const MAXPT=250,ALL=['kamu','raka','nadia','bima'];
const S=window.GameLMSState={name:'',score:0,progress:0,mission:0,badges:[],wrong:[0,0,0,0,0],done:[],pct:0,finished:false};
// Event untuk wrapper LMS/SCORM: window.addEventListener('gamelms:complete', e=>...) atau postMessage ke parent
const emit=(t,d={})=>{const p={type:t,...d,state:JSON.parse(JSON.stringify(S))};window.dispatchEvent(new CustomEvent('gamelms:'+t,{detail:p}));try{if(parent!==window)parent.postMessage({source:'weekend-hangout',...p},'*')}catch(e){}};

/* ===== AUDIO (Web Audio API murni) ===== */
const mtof=m=>440*2**((m-69)/12);
const CHORDS=[[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59]],PENT=[72,74,76,79,81,84];
const A={ctx:null,on:true,
init(){if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=this.ctx=new C();
 this.m=c.createGain();this.m.connect(c.destination);this.b=c.createGain();this.b.gain.value=this.on?.5:0;this.b.connect(this.m);
 this.f=c.createBiquadFilter();this.f.type='lowpass';this.f.frequency.value=1300;this.f.connect(this.b);
 const n=c.createBuffer(1,c.sampleRate,c.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.nb=n;
 this.st=0;this.nx=c.currentTime+.1;setInterval(()=>this.sch(),100)}
 if(this.ctx.state==='suspended')this.ctx.resume()},
tone(f,t,d,ty='sine',v=.2,to,dst){const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+Math.min(.03,d/3));g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dst||this.m);o.start(t);o.stop(t+d+.05)},
nz(t,d,v,hp,dst){const c=this.ctx,s=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();s.buffer=this.nb;f.type='highpass';f.frequency.value=hp;
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(dst||this.m);s.start(t);s.stop(t+d)},
sch(){const c=this.ctx;while(this.nx<c.currentTime+.4){this.note(this.st++,this.nx);this.nx+=60/76/2}},
note(s,t){const p=s%8,ch=CHORDS[Math.floor(s/8)%4],t2=t+(s%2?.03:0);
 if(p===0){ch.forEach(m=>this.tone(mtof(m),t,3.2,'triangle',.07,0,this.f));this.tone(mtof(ch[0]-12),t,1.2,'sine',.2,0,this.b)}
 if(p===0||p===5)this.tone(130,t,.25,'sine',.5,40,this.b);
 if(p===4)this.nz(t,.12,.18,1500,this.b);
 if(s%2)this.nz(t2,.04,.07,7000,this.b);
 if(p&&Math.random()<.3)this.tone(mtof(PENT[Math.random()*6|0]),t2,.5,'sine',.08,0,this.f)},
toggle(){this.on=!this.on;if(this.ctx)this.b.gain.setTargetAtTime(this.on?.5:0,this.ctx.currentTime,.1);return this.on}};
const SFX={
tap(t){A.tone(620,t,.06,'sine',.12)},
swipe(t){A.tone(300,t,.14,'sine',.12,900)},
drop(t){A.tone(240,t,.14,'triangle',.25,110)},
ok(t){[523,659,784].forEach((f,i)=>A.tone(f,t+i*.09,.18,'triangle',.18))},
bad(t){A.tone(330,t,.22,'sine',.16,250)},
badge(t){[784,988,1175,1568].forEach((f,i)=>A.tone(f,t+i*.08,.35,'sine',.16))},
done(t){[523,659,784,1047].forEach((f,i)=>A.tone(f,t+i*.12,.3,'triangle',.18))}};
const sfx=n=>{if(!A.ctx)return;try{SFX[n](A.ctx.currentTime)}catch(e){}};
addEventListener('pointerdown',()=>A.init(),{once:true});addEventListener('keydown',()=>A.init(),{once:true});
$('#mute').onclick=()=>{A.init();$('#mute').textContent=A.toggle()?'🔊':'🔇';sfx('tap')};

/* ===== KARAKTER (SVG ber-artikulasi) ===== */
const CH={kamu:{n:'Kamu',c:'#5ec6b0',h:'#2b2d42',s:'#f1c27d'},raka:{n:'Raka',c:'#ff9f6e',h:'#5a3320',s:'#e0ac69'},
 nadia:{n:'Nadia',c:'#ff8fb1',h:'#241a2e',s:'#f6d1b0',lg:1},bima:{n:'Bima',c:'#6fa8ff',h:'#3a2a20',s:'#c68642'}};
const MOUTH={happy:'M24 29Q30 36 36 29',sad:'M25 34Q30 28 35 34',meh:'M26 31H34'};
const svg=k=>{const c=CH[k],leg=(x,cl)=>`<g class="leg ${cl}"><rect x="${x}" y="62" width="8" height="26" rx="4" fill="#3d405b"/><rect x="${x-2}" y="85" width="12" height="7" rx="3.5" fill="#fff" stroke="#2b2d42"/></g>`,
 arm=(x,cl)=>`<g class="arm ${cl}"><rect x="${x}" y="40" width="7" height="24" rx="3.5" fill="${c.c}"/><circle cx="${x+3.5}" cy="65" r="4" fill="${c.s}"/></g>`;
 return `<svg class="sv" viewBox="0 0 60 100" aria-hidden="true">${leg(21,'l')}${leg(31,'r')}<g class="body">${arm(10,'l')}${arm(43,'r')}<rect x="16" y="38" width="28" height="29" rx="10" fill="${c.c}"/>${k==='kamu'?'<text x="30" y="58" font-size="12" text-anchor="middle" fill="#fff">★</text>':''}
 <g class="head">${c.lg?`<rect x="14" y="12" width="32" height="36" rx="14" fill="${c.h}"/>`:''}<circle cx="30" cy="24" r="15" fill="${c.s}"/>
 <path d="${k==='raka'?'M15 22Q16 9 30 9Q44 9 45 22Q38 16 30 16Q22 16 15 22Z':'M14 25Q12 6 30 7Q48 6 46 25Q38 14 30 15Q22 14 14 25Z'}" fill="${c.h}"/>
 <g class="eye"><circle cx="24" cy="24" r="2.2" fill="#2b2d42"/><circle cx="36" cy="24" r="2.2" fill="#2b2d42"/></g>
 <circle cx="20" cy="29" r="2.5" fill="#ff8fa3" opacity=".45"/><circle cx="40" cy="29" r="2.5" fill="#ff8fa3" opacity=".45"/>
 <path class="mouth" d="${MOUTH.happy}" stroke="#7a3b3b" stroke-width="1.8" fill="none" stroke-linecap="round"/></g></g></svg>`};
const charH=(k,o={})=>`<div class="char" data-k="${k}"><div class="bub"></div>${svg(k)}${o.bar?'<div class="bar"><i></i></div>':''}<div class="nm">${CH[k].n}</div>${o.tags?'<div class="tags"></div>':''}</div>`;
const crew=(ids,o)=>`<div class="crew">${ids.map(k=>charH(k,o)).join('')}</div>`;
const ch=k=>$(`.char[data-k="${k}"]`);
// set(kunci, kelas animasi, emoji bubble, mood mulut)
const set=(k,st,emo,mood)=>{const e=ch(k);if(!e)return;['walk','slow','jump','shiver','wave','tired','sit'].forEach(c=>e.classList.remove(c));(st||'').split(' ').filter(Boolean).forEach(c=>e.classList.add(c));
 if(emo!==undefined)$('.bub',e).innerHTML=emo?`<span>${emo}</span>`:'';if(mood)$('.mouth',e).setAttribute('d',MOUTH[mood])};
const all=(st,emo,mood)=>ALL.forEach(k=>set(k,st,emo,mood));

/* ===== NAVIGASI & HUD ===== */
const V=$('#view');let stopRainF=()=>{};
function hud(){$('#sc').textContent=S.score;$('#pgv').textContent=S.progress+'%';$('#pgb').style.width=S.progress+'%';$('#hn').textContent=S.name?'· '+S.name:''}
function go(html,init){sfx('tap');const swap=()=>{stopRainF();V.innerHTML=html;V.className='in';window.scrollTo({top:0,behavior:'smooth'});init&&init();hud()};
 if(!V.innerHTML)swap();else{V.className='out';setTimeout(swap,220)}}
const fb=(t,m)=>{$('#fb').innerHTML=m?`<div class="fb ${t}">${m}</div>`:''};
function toast(b){const t=document.createElement('div');t.className='toast';t.textContent=`${b.i} Lencana: ${b.n}!`;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),2800)}
const BD=[{id:'first',i:'🧊',n:'First Step',d:'Selesaikan Misi 1'},{id:'plan',i:'🎒',n:'Empathetic Planner',d:'Misi 2 tanpa salah'},{id:'rain',i:'☔',n:'Calm Under Rain',d:'Misi 3 tanpa salah'},{id:'fair',i:'⚖️',n:'Fair Coordinator',d:'Misi 4 tanpa salah'},{id:'gold',i:'👑',n:'Golden Hangout Leader',d:'Skor akhir ≥ 85%'}];
function award(id){if(S.badges.includes(id))return;S.badges.push(id);toast(BD.find(x=>x.id===id));sfx('badge');emit('badge',{badge:id})}
let lock=false;
const bad=(i,m)=>{S.wrong[i]++;S.score=Math.max(0,S.score-5);sfx('bad');fb('no',m+' (−5 poin)');hud();emit('wrong',{mission:i+1})};

/* ===== DRAG & DROP (pointer events, + fallback tap) & SWIPE ===== */
function drag(el,drop,tap){el.style.touchAction='none';
 el.onpointerdown=e=>{const x0=e.clientX,y0=e.clientY;let g=null;el.setPointerCapture(e.pointerId);
  const end=()=>{el.onpointermove=el.onpointerup=el.onpointercancel=null;g&&g.remove()};
  el.onpointermove=ev=>{if(!g&&Math.hypot(ev.clientX-x0,ev.clientY-y0)>8){g=el.cloneNode(true);g.classList.add('dg');document.body.appendChild(g)}if(g){g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px'}};
  el.onpointercancel=end;
  el.onpointerup=ev=>{const had=!!g;g&&g.remove();el.onpointermove=el.onpointerup=el.onpointercancel=null;
   if(had){const t=document.elementFromPoint(ev.clientX,ev.clientY),c=t&&t.closest('.char');c&&drop(c.dataset.k)}else tap()}}}
function swipe(el,cb){let x0=null,dx=0;const sl=$('.sl',el),sr=$('.sr',el);
 el.onpointerdown=e=>{x0=e.clientX;el.setPointerCapture(e.pointerId);el.style.transition='none'};
 el.onpointermove=e=>{if(x0===null)return;dx=e.clientX-x0;el.style.transform=`translateX(${dx}px) rotate(${dx/15}deg)`;sl.style.opacity=dx<0?Math.min(1,-dx/80):0;sr.style.opacity=dx>0?Math.min(1,dx/80):0};
 el.onpointerup=()=>{if(x0===null)return;x0=null;el.style.transition='';const d=dx;dx=0;if(Math.abs(d)>80)cb(d>0?1:-1);else{el.style.transform='';sl.style.opacity=sr.style.opacity=0}}}
const pick=cb=>$$('.char').forEach(c=>c.onclick=()=>cb(c.dataset.k));

function results(){const pct=Math.min(100,Math.round(S.score/MAXPT*100));S.pct=pct;S.finished=true;if(pct>=85)award('gold');
 const rank=pct>=85?'👑 Golden Hangout Leader':pct>=65?'⚖️ Fair Coordinator':pct>=40?'🌱 Rising Leader':'🧊 Newbie Planner';
 const msg=pct>=85?'Luar biasa! Kamu peka pada kebutuhan tiap teman dan memimpin dengan hangat. Pertahankan!':pct>=60?'Keren! Kamu sudah peka di banyak situasi. Satu dua keputusan lagi bisa disesuaikan untuk hasil maksimal.':'Terima kasih sudah berusaha! Empati itu otot yang dilatih. Coba lagi dan perhatikan kebutuhan tiap teman, hasilnya pasti naik.';
 go(`<div class="card"><div class="score">⭐ ${S.score}</div><p class="rank">${rank}</p><p class="sub" style="text-align:center">Skor ${S.score}/${MAXPT} · Penyelesaian 100% · Ketepatan ${pct}%</p></div>
 <div class="card"><h3>🏅 Lencana</h3><div class="bg">${BD.map(b=>`<div class="bd${S.badges.includes(b.id)?'':' lock'}"><span>${b.i}</span>${b.n}<br><small>${b.d}</small></div>`).join('')}</div></div>
 <div class="card"><h3>📝 Feedback tiap misi</h3>${TT.map((t,i)=>`<div class="rv"><b>Misi ${i+1}: ${t}</b><br>${S.wrong[i]?`🔄 Perlu disesuaikan (${S.wrong[i]} salah langkah)`:'✅ Keputusan tepat'}<br><small>${EX[i]}</small></div>`).join('')}</div>
 <div class="card"><h3>💬 Pesan untukmu, ${S.name}</h3><p>${msg}</p></div><button class="btn alt" id="again">Main Lagi 🔁</button>`,()=>{
  emit('complete',{score:S.score,max:MAXPT,pct,rank});/* SCORM SIGNAL: layar hasil (tombol "Main Lagi") tampil -> misi selesai */try{if(parent!==window)parent.postMessage({jenis:'GAME_SELESAI',nilai:pct},'*')}catch(e){}$('#again').onclick=()=>{emit('restart');Object.assign(S,{score:0,progress:0,badges:[],wrong:[0,0,0,0,0],done:[],finished:false,pct:0});gateway()}})}

gateway();
})();
</script>
